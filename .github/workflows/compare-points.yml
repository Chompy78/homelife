name: Compare POINTS between backend and frontend
on: pull_request: paths: - 'supabase/functions/family-api/' - 'apps/shared/' - 'scripts/compare-points.js' push: branches: [main] paths: - 'supabase/functions/family-api/' - 'apps/shared/' - 'scripts/compare-points.js'
jobs: compare: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - name: Setup Node.js uses: actions/setup-node@v4 with: node-version: '18' - name: Run POINTS comparison script run: | node scripts/compare-points.js
